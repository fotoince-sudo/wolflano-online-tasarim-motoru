<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolflano Tasarla</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{--p:#6a2cf5;--pl:#efe9ff;--bd:#e4e4ec;--tx:#1d1d2b;--mut:#6b6b80}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f9;color:var(--tx)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:#fff;padding:6px 16px 8px;box-shadow:0 1px 6px #0001;z-index:20}
.logo{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-.5px}
.logo small{font-style:normal;font-weight:700;font-size:22px;color:var(--p);margin-left:10px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin-top:4px}
.print-formats,.history,.order-actions{display:flex;align-items:center;gap:6px}
.print-formats{grid-column:1;gap:10px}
.print-formats[hidden]{display:none}
.history{grid-column:2}
.order-actions{grid-column:3;justify-content:flex-end}
.format-button{display:grid;place-content:center;justify-items:center;gap:3px;min-width:48px;height:42px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:11px;font-weight:700;line-height:1}
.format-button[aria-pressed=true]{border-color:var(--p);background:var(--pl);color:var(--p)}
.format-glyph{display:block;width:13px;height:18px;border:1.5px solid currentColor;border-radius:2px}
.format-glyph.landscape{width:18px;height:13px}
.format-glyph.square{width:13px;height:13px}
.history .ib{display:grid;place-items:center;padding:0;border:1px solid #cfc4ef;background:var(--pl);color:var(--p)}
.history .ib:disabled{opacity:1;border-color:#d7d7e0;background:#f0f0f5;color:#6b6b80;cursor:default}
.history .ib svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round}
.ib{width:42px;height:42px;border:0;border-radius:10px;background:#f0f0f5;font-size:20px}
.ib:disabled{opacity:.4}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;color:#fff;font-size:15px}
.btn.pr{background:var(--p);box-shadow:0 3px 10px #6a2cf555}
#cart{background:#137a42;box-shadow:0 3px 10px #137a4255}
#cart svg,#boardDelete svg{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px #0001}
.fly{display:none}
.fly.on{display:block}
.fly h4{margin:0 0 10px;font-size:17px}
#f-template details{margin-top:6px;border:1px solid var(--bd);border-radius:9px}
#f-template summary{padding:10px 12px;cursor:pointer;font-weight:600}
#f-template summary::marker{color:var(--p)}
#f-template details[open]>summary{background:var(--pl);border-radius:8px 8px 0 0}
.template-options{display:grid;gap:10px;padding:10px}
.template-options h5{margin:0 0 6px;font-size:13px}
.sel{margin-top:12px;display:none}
input[type=text],textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;margin-bottom:8px;background:#fff}
.r{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.r label{font-size:13px;min-width:56px;color:var(--mut)}
.r input[type=range]{flex:1;accent-color:var(--p)}
.sm{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 10px}
.sm:hover{background:var(--pl)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{font-size:22px;padding:6px}
.app>*{min-width:0}
.stage .wrap{position:relative;background:#8d8d8d;border-radius:12px;padding:4px;width:min(100%,calc(100vh - 140px));margin:0 auto}
.vp{touch-action:none;overflow:auto;aspect-ratio:1;border-radius:10px}
canvas#c{display:block;width:100%;margin:0 auto;touch-action:none;cursor:move}
#boardDelete{position:absolute;top:calc(5% + 10px);left:calc(5% + 10px);display:flex;align-items:center;gap:4px;min-height:40px;padding:0 9px;border:1px solid #b42334;border-radius:9px;background:#fff;color:#a8192b;font-size:13px;font-weight:700;box-shadow:0 1px 4px #0003}
#boardDelete[hidden]{display:none}
#boardDelete svg{width:16px;height:16px}
.lbl{position:absolute;left:18px;bottom:16px;color:#fff;font-size:13px;line-height:1.3;pointer-events:none;text-shadow:0 1px 2px #0006}
.tog{position:absolute;right:16px;bottom:14px;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px #0003}
.tog input{width:36px;height:20px;accent-color:var(--p)}
.colpop{display:none;position:fixed;left:88px;background:#fff;border:1px solid #d7d7e0;border-radius:14px;padding:12px;box-shadow:0 6px 20px #0003;z-index:5;width:max-content;max-width:92vw}
.colpop.open{display:block}
.colpop .cols{gap:10px;flex-wrap:nowrap}
#prodBox,#bedenBox{display:none!important}
.opts section{padding:12px 0;border-bottom:1px solid var(--bd)}
.opts section:last-child{border:0}
.opts section:first-child{padding-top:0}
.prods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.prods button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:3px 2px;font-size:11px}
.prods button canvas{width:100%;height:auto;display:block;border-radius:6px;background:#e7e7ee}
.prods button.on{border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset}
.cols{display:flex;gap:12px;flex-wrap:wrap}
.cols button{width:42px;height:42px;border-radius:50%;border:2px solid #cfcfe0;padding:0}
.cols button.on{outline:3px solid var(--p);outline-offset:2px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:10px 11px;font-weight:600;font-size:14px}
.sizes button.on{background:var(--p);color:#fff;border-color:var(--p)}
.info{display:flex;gap:14px;align-items:center;background:var(--pl);border-radius:10px;padding:12px;margin-top:10px;font-size:15px}
.info b{display:block;margin-bottom:3px}
.info span{margin-right:14px}
.views{display:flex;gap:4px}
.views[hidden]{display:none}
.views button{display:flex;align-items:center;justify-content:center;gap:4px;height:42px;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:0 7px;font-size:12px;font-weight:700;white-space:nowrap}
.views button[aria-pressed=true]{border-color:var(--p);background:var(--pl);color:var(--p)}
.views canvas{width:21px;height:21px;display:block;border-radius:4px}
.zoom{display:flex;align-items:center;gap:10px}
.zoom input{flex:1;accent-color:var(--p)}
.zoom .ib{width:38px;height:38px;font-size:17px;background:#fff;border:1px solid var(--bd)}
dialog{border:0;border-radius:16px;padding:18px;max-width:min(96vw,900px);width:100%}
dialog::backdrop{background:#000a}
.pv{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pv figure{margin:0;flex:1 1 300px;text-align:center}
.pv img{width:100%;border-radius:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d2b;color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:50}
.hint{font-size:12px;color:var(--mut)}
/* Canva benzeri düzen */
html,body{height:100%;margin:0}
body{height:100dvh}
body{display:flex;flex-direction:column;overflow:hidden}
.ctx{display:flex;align-items:center;gap:12px;background:#fff;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px 16px;min-height:52px;flex-wrap:wrap}
.ctx[hidden]{display:none}
.bar .info{margin:0;padding:6px 10px;font-size:12px;gap:8px}
.bar .info b{display:inline;margin:0 6px 0 0}
.bar .info svg{width:22px;height:22px}
.ctx #sel{margin:0;flex:1;min-width:0}
.selIn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctx #sel .r{margin:0}
.ctx #sel .r label{min-width:0}
.ctx #sel .r input[type=range]{width:70px;flex:none}
#f-text .selIn{gap:8px}
#f-text #pFont{width:auto;margin:0}
#f-text #sel .r{margin:0}
#f-text #sel .sl{width:100%}
#f-text #addText,#f-text #newText{width:100%}
.app{flex:1;min-height:0;display:flex}
.rail{width:80px;flex:none;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;padding:8px 0}
.nav{display:flex;flex-direction:column;gap:5px;align-items:center}
.nav button{width:68px;border:0;background:none;border-radius:12px;padding:5px 2px;font-size:11px;font-weight:600;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.15}
.nav button i{font-style:normal;width:46px;height:46px;display:grid;place-items:center;background:var(--tool-tint,#f3f1fb);color:var(--tool-ink,var(--p));border-radius:12px}
.nav button.on{color:var(--tool-ink,var(--p))}
.nav button.on i{background:var(--tool-ink,var(--p));color:#fff}
.tool-label{white-space:nowrap}
#qaProd{--tool-tint:#e6f2ff;--tool-ink:#1c5eac}
#qaCol{--tool-tint:#fce8f4;--tool-ink:#9e2967}
.nav [data-t=text]{--tool-tint:#edeefe;--tool-ink:#4e46b0}
.nav [data-t=image]{--tool-tint:#dff6ed;--tool-ink:#12704b}
.nav [data-t=template]{--tool-tint:#f2e7ff;--tool-ink:#7134b1}
.nav [data-t=qr]{--tool-tint:#e1f6fc;--tool-ink:#08657c}
.nav [data-t=bg]{--tool-tint:#fff0df;--tool-ink:#a04b16}
.nav .wolf-tool{flex-direction:row;justify-content:center;gap:7px;width:74px;font-weight:700}
.nav .wolf-tool i,.nav .wolf-tool.on i{width:36px;background:#141316;color:#ffce47}
.nav .wolf-tool svg{width:24px;height:24px;fill:currentColor;stroke:none;filter:drop-shadow(0 0 3px #ffbd3e99)}
.nav i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav2{border-bottom:1px solid var(--bd);margin-bottom:6px;padding-bottom:6px}
.panel{display:none;width:300px;flex:none;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;padding:16px;position:relative}
.panel.open{display:block}
.panel .x{position:absolute;right:10px;top:10px;border:0;background:#f0f0f5;border-radius:50%;width:30px;height:30px}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#e6e6ee}
.canvasArea{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center}
.stage .wrap{width:min(100%,calc(100vh - 270px));min-width:260px;margin:0 auto;flex:none}
.bar{display:flex;align-items:center;gap:14px;background:#fff;border-top:1px solid var(--bd);padding:8px 16px;flex-wrap:wrap}
.bar .zoom{margin-left:auto}
.bar .zoom input{width:160px;flex:none}
.bar .zoom .ib{width:34px;height:34px;font-size:14px}
.product-mode>.top,.product-mode>.ctx,.product-mode>.app{display:none}
.product-page{flex:1;min-height:0;overflow:auto;background:#f5f4fa;padding:clamp(14px,4vw,44px)}
.product-shell{max-width:960px;margin:0 auto}
.product-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.product-header h1{font-size:clamp(22px,4vw,34px);margin:0}
.product-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,1fr);gap:20px;align-items:start}
.product-model,.product-form{padding:clamp(12px,2vw,20px);border:1px solid var(--bd);border-radius:14px;background:#fff}
.product-model h2{margin:0 0 10px;font-size:20px}
.product-views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.product-views figure{margin:0}
.product-views canvas{display:block;width:100%;height:auto;border-radius:8px}
.product-views figcaption{text-align:center;margin-top:5px;font-size:13px;font-weight:700}
.product-measure{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font-size:13px;color:var(--mut)}
.product-measure strong{color:var(--tx)}
.product-form fieldset{padding:0;margin:0 0 14px;border:0;min-width:0}
.product-form legend,.product-print-label{font-weight:700;margin-bottom:6px}
.product-print-label{display:block}
.product-choices{display:flex;flex-wrap:wrap;gap:6px}
.product-choices label{position:relative;cursor:pointer}
.product-choices input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.product-choices label span{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 9px;min-height:36px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.product-choices input:checked+span{border-color:var(--p);background:var(--pl);color:var(--p)}
.product-choices input:focus-visible+span{outline:2px solid var(--p);outline-offset:2px}
.product-color{width:15px;height:15px;border:1px solid #1d1d2b42;border-radius:50%}
.product-form .btn{width:100%;margin-top:4px}
@media(max-width:700px){
  .product-layout{grid-template-columns:minmax(0,1fr);gap:10px}
  .product-header{margin-bottom:10px}
  .product-form fieldset{margin-bottom:10px}
}
@media(max-width:800px){
  body{overflow:auto;display:block;height:auto}
  .app{display:block}
  .stage{background:#e6e6ee}
  .canvasArea{overflow:visible;padding:10px}
  .stage .wrap{width:100%;min-width:0}
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:68px;z-index:30;border-right:0;border-top:1px solid var(--bd);padding:4px 6px;overflow-x:auto;overflow-y:hidden}
  .rail{display:flex;gap:4px}
  #nav2{flex-direction:row;border-bottom:0;margin:0;padding:0;border-right:1px solid var(--bd);padding-right:4px}
  .nav{flex-direction:row;justify-content:flex-start;gap:5px;width:max-content}
  .colpop{left:50%;transform:translateX(-50%);top:auto!important;bottom:84px}
  .nav button{flex:none;width:52px;padding-block:3px;gap:3px}
  .nav button i{width:44px;height:42px}
  .nav .wolf-tool{width:70px}
  .nav .wolf-tool i{width:34px}
  .panel{position:fixed;left:0;right:0;bottom:76px;width:auto;max-height:46vh;z-index:29;border-right:0;border-top:1px solid var(--bd);box-shadow:0 -6px 20px #0002;border-radius:16px 16px 0 0}
  .bar{margin-bottom:76px}
  .bar .zoom{display:none}
  .logo{font-size:20px}.logo small{font-size:16px}
  .btn{padding:9px 12px;font-size:13px}.ib{width:36px;height:36px}
  .top{padding:4px 8px 6px}
  html,body{overflow-x:hidden;max-width:100vw}
  .ctx{padding:6px 10px;display:block}
  .selIn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ctx #sel .r{flex-wrap:nowrap;min-width:0}
  .ctx #sel .r input[type=range]{flex:1;width:auto;min-width:0}
  .ctx #sel .r input[type=color]{flex:none}
  .ctx #sel .r:last-child{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ctx #sel .sl{display:none}
  .ctx #sel #selColor{grid-column:1/-1}
  .ctx #sel .sm{padding:8px 2px;font-size:13px}
  #f-text #sel .sl{display:none}
  #f-text #sel .r:last-child{grid-column:1/-1}
}
@media(max-width:430px){
  .rail{gap:3px;padding-inline:4px}
  .nav{gap:4px}
  .nav button{width:40px;font-size:10px}
  .nav button i{width:38px;height:42px}
}
@media(max-width:960px){
  .order-actions .btn{display:grid;place-items:center;width:36px;height:38px;padding:0;font-size:18px}
  .order-actions .action-label{display:none}
}
@media(max-width:720px){
  .print-formats{gap:6px}
  .history,.order-actions,.views{gap:3px}
  .format-button{min-width:31px;height:40px;font-size:10px}
  .views button{min-width:28px;height:38px;padding:0 2px;font-size:11px}
  .views canvas{display:none}
}
@media(max-width:389px){
  .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:4px}
  .print-formats,.order-actions{grid-row:1}
  .order-actions{grid-column:2}
  .history{grid-area:2/1/3/3;justify-self:center}
}
@media(max-width:359px){
  .print-formats{gap:5px}
  .format-button{min-width:29px}
  .history .ib{width:33px}
}
@media(max-height:520px) and (min-width:801px){
  .stage .wrap{width:min(100%,calc(100vh - 220px))}
  .top{padding:3px 10px}.ib{width:32px;height:32px}.btn{padding:7px 10px}
  .format-button,.views button{height:32px}
  .ctx{min-height:40px;padding:3px 10px}
  .tog{font-size:10px;padding:3px 7px;right:8px;bottom:8px}.tog input{width:28px;height:16px}
  .lbl{font-size:9px;left:10px;bottom:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🐺 WOLFLANO<small>Tasarla</small></div>
  <div class="toolbar">
    <div id="printFormats" class="print-formats" role="group" aria-label="Baskı boyutu"></div>
    <div class="history" role="group" aria-label="Düzenleme geçmişi">
      <button type="button" class="ib" id="undo" title="Geri al" aria-label="Geri al"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 6 6v3"/></svg></button>
      <button type="button" class="ib" id="redo" title="İleri al" aria-label="İleri al"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5 5 5-5 5m5-5H10a6 6 0 0 0-6 6v3"/></svg></button>
    </div>
    <div class="order-actions">
      <div class="views" id="views" role="group" aria-label="Baskı yüzü"></div>
      <button type="button" class="btn pr" id="preview" title="Ön İzleme" aria-label="Ön İzleme"><span aria-hidden="true">👁</span> <span class="action-label">Ön İzleme</span></button>
      <button type="button" class="btn" id="cart" title="Sepete Ekle" aria-label="Sepete Ekle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.5 12h11.4l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg> <span class="action-label">Sepete Ekle</span></button>
    </div>
  </div>
</header>

<div class="ctx" id="context" hidden>
  <div class="info" id="info" style="display:none"></div>
  <div class="sel" id="sel"><div class="selIn">
        <select id="pFont" aria-label="Yazı tipi" hidden>
          <option>Arial</option><option>Georgia</option><option>Impact</option>
          <option>Courier New</option><option>Comic Sans MS</option><option>Brush Script MT</option>
        </select>
        <div class="r" id="selColor"><label>Renk</label><input type="color" id="pColor" value="#000000"></div>
        <div class="r sl"><label id="sizeLbl">Boyut</label><input type="range" id="pScale" min="1" max="60" step="0.5"></div>
        <div class="r sl"><label>Döndür</label><input type="range" id="pRot" min="-180" max="180"></div>
        <div class="r"><button class="sm" id="front">⬆ Öne</button><button class="sm" id="back">⬇ Arkaya</button><button class="sm" id="dup">⧉ Kopyala</button><button class="sm" id="del">🗑 Sil</button></div>
      </div></div>
</div>

<div class="app">
  <aside class="rail">
    <div class="nav" id="nav2">
      <button type="button" id="qaProd" title="Ürün Seç" aria-label="Ürün Seç"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2.5 4L8 9v12h8V9l2.5 1L21 6l-5-3c-.6 1.6-2 2.5-4 2.5S8.6 4.6 8 3z"/></svg></i><span class="tool-label">Ürün</span></button>
      <button type="button" id="qaCol" title="Renk Seç" aria-label="Renk Seç"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.300 0 2-.9 2-2 0-1.500-1-1.700-1-3 0-1 .8-2 2-2h2.500A3.500 3.500 0 0021 10.500C21 6.300 17 3 12 3z"/><circle cx="7.500" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.500" cy="7" r="1"/></svg></i><span class="tool-label">Renk</span></button>
    </div>
    <div class="nav" id="nav">
        <button type="button" data-t="text" title="Metin Ekle" aria-label="Metin Ekle"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16m-4 0h8"/></svg></i><span class="tool-label">Metin</span></button>
        <button type="button" data-t="image" title="Görsel Ekle" aria-label="Görsel Ekle"><i aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 6"/></svg></i><span class="tool-label">Görsel</span></button>

<script>
const W=720, S=6, CX=360, CY=380, R=1.5;      // duvar 120x120 cm = 720 birim, 6 birim = 1 cm
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function el(t,p={},parent){const e=Object.assign(document.createElement(t),p);parent&&parent.append(e);return e}

// Gildan resmi ölçü tabloları (inç → cm): [göğüs eni, boy, merkez arka yakadan kol hizası]
const IN=2.54, SIZES=['S','M','L','XL','2XL','3XL','4XL','5XL'];
const CHEST=[18,20,22,24,26,28,30,32];
function mk(len,slv){const o={};SIZES.forEach((s,i)=>o[s]=[CHEST[i]*IN,len[i]*IN,slv[i]*IN]);return o}
const OLCU_TISORT=mk([28,29,30,31,32,33,34,35],[15.625,17,18.5,20,21.5,22.375,23.625,25]);   // Gildan 5000
const OLCU_UZUN=mk([27,28,29,30,31,32,33,34],[33,34,35,36,37,38,39,40]);                    // Gildan 18500 (sweatshirt için de kullanıldı)
const OLCU={tisort:OLCU_TISORT,sweat:OLCU_UZUN,hoodie:OLCU_UZUN};
const BEDEN=OLCU_TISORT;
const GIYIM_BASKI=[
  {n:'A4 dikey 21×29,7 cm',short:'A4',w:21,h:29.7},
  {n:'A4 yatay 29,7×21 cm',short:'A4',w:29.7,h:21},
  {n:'A3 dikey 29,7×42 cm',short:'A3',w:29.7,h:42},
  {n:'Logo 8×8 cm (sol göğüs)',short:'8×8',w:8,h:8,logo:true}
];
const PRODUCTS={
  tisort:{name:'Tişört',kind:'giyim',sizes:GIYIM_BASKI,def:0,tz:1,zoom:100},
  sweat:{name:'Sweatshirt',kind:'giyim',sizes:GIYIM_BASKI,def:0,tz:1,zoom:100},
  hoodie:{name:'Hoodie',kind:'giyim',sizes:GIYIM_BASKI,def:0,tz:1,zoom:100},
  sapka:{name:'Şapka',kind:'sapka',sizes:[{n:'Şapka 20×8 cm',w:20,h:8}],def:0,tz:2.6,zoom:250},
  kupa:{name:'Kupa',kind:'kupa',sizes:[{n:'Kupa 9×20 cm (açık baskı)',w:20,h:9}],def:0,tz:2.4,zoom:250},
  kanvas:{name:'Kanvas',kind:'kanvas',def:0,tz:1.1,zoom:100,bleed:3.75,sizes:[
    {n:'Kanvas dikey 35×50 cm (+3,75 cm katlama payı)',short:'35×50',w:42.5,h:57.5},
    {n:'Kanvas yatay 50×35 cm (+3,75 cm katlama payı)',short:'50×35',w:57.5,h:42.5}]}
};
const COLORS=[['Beyaz','#ffffff'],['Siyah','#1a1a1a'],['Lacivert','#1f2a44'],['Gri','#a8a8a8'],['Bej','#e3d9c0'],['Yeşil','#4b6b22']];
const VIEWS=[['on','Ön'],['arka','Arka'],['solyan','Sol Yan'],['sagyan','Sağ Yan'],['yaka','Yaka Detayı']];
const EMOJIS=['😀','😍','🔥','⭐','❤️','🎉','🐱','🐶','🌈','⚽','🎸','🚀'];
const SHAPES=[['rect','▭'],['circle','●'],['star','★'],['heart','♥'],['tri','▲']];
const PRESETS=[
  {n:'⭐ Yıldız Rozeti',items:[{type:'shape',shape:'star',size:.8,fill:'#e8465a'},{type:'text',text:'STAR',size:.18,fill:'#ffffff',font:'Impact'}]},
  {n:'❤ Aşk',items:[{type:'shape',shape:'heart',size:.8,fill:'#e8465a'},{type:'text',text:'LOVE',size:.16,fill:'#ffffff',font:'Georgia'}]},
  {n:'🚀 Hayal Et',items:[{type:'text',text:'🚀',size:.45,dy:-.12},{type:'text',text:'HAYAL ET',size:.14,dy:.28,font:'Impact'}]},
  {n:'🏆 Takım',items:[{type:'shape',shape:'circle',size:.8,fill:'#1f2a44'},{type:'text',text:'TAKIM',size:.17,fill:'#ffffff',font:'Impact'}]},
  {n:'🎉 Mutlu Yıllar',items:[{type:'text',text:'🎉',size:.4,dy:-.15},{type:'text',text:'Mutlu Yıllar',size:.12,dy:.25,font:'Brush Script MT'}]},
  {n:'🐺 Wolf Tasarımları',items:[{type:'text',text:'🐺',size:.5,dy:-.1},{type:'text',text:'WOLFLANO',size:.12,dy:.3,font:'Impact'}]}
];

// ---- durum
let product='tisort', view='on', color='#ffffff', colorName='Beyaz', beden='L', zoom=100, showArea=true;
const sizeIdx={}; Object.keys(PRODUCTS).forEach(k=>sizeIdx[k]=PRODUCTS[k].def);
let designs={}, bgs={}, sel=null;
const key=(p=product,v=view)=>p+'|'+v;
const cur=()=>designs[key()]||(designs[key()]=[]);
const isGiyim=(p=product)=>PRODUCTS[p].kind==='giyim';

function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+amt));return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}
const curSize=(p=product)=>PRODUCTS[p].sizes[sizeIdx[p]];
function dims(p=product,garmentSize=beden){const [e,b,sl]=OLCU[p][garmentSize];return{e,b,sl,E:e*S,B:b*S}}
const NECK_FRONT=7.6, NECK_BACK=2; // yaka derinliği (cm)
function getArea(p=product,v=view,garmentSize=beden,cm=curSize(p)){
  const w=cm.w*S,h=cm.h*S;
  if(isGiyim(p)){
    const {B}=dims(p,garmentSize),t=CY-B/2;
    // Standart yerleşim: ön baskı yaka dikişinin 6,4 cm (2,5") altından, sol göğüs logosu 8,9 cm (3,5") altından ve merkezden 13 cm sağda (giyenin solu)
    const dx=cm.logo&&v==="on"?13*S:0;
    const top=t+(v==='on'?(NECK_FRONT+(cm.logo?8.9:6.4)):(NECK_BACK+5.1))*S;
    return{x:CX+dx-w/2,y:top,w,h,cm};
  }
  return{x:CX-w/2,y:CY-h/2,w,h,cm};
}

// ---- ürün çizimi (duvar koordinatlarında)
function fillStroke(col){ctx.fillStyle=col;ctx.strokeStyle=shade(col,-55);ctx.lineWidth=2;ctx.save();ctx.shadowColor='#0005';ctx.shadowBlur=22;ctx.shadowOffsetY=8;ctx.fill();ctx.restore();ctx.stroke()}
function drawGarment(p,v,col,garmentSize=beden){
  const {e,b,sl,B}=dims(p,garmentSize),t=CY-B/2,front=v==='on',X=CX;
  const nd=front?NECK_FRONT:NECK_BACK,hn=8.5+(e-45.7)*0.08,tipX=e/2+1,tipY=4,ay=p==='tisort'?0.33*b:0.32*b;
  const P=(x,y)=>[X+x*S,t+y*S],pt=(x,y)=>ctx.lineTo(...P(x,y)),mv=(x,y)=>ctx.moveTo(...P(x,y));
  const dist=Math.hypot(tipX,tipY),slv=Math.max(sl-dist,8),r=Math.PI/180;
  let out;                                    // kol ucu (dış nokta)
  if(p==='tisort'){out=[tipX+slv*Math.cos(50*r),tipY+slv*Math.sin(50*r)]}
  else{out=[tipX+slv*Math.cos(78*r),tipY+slv*Math.sin(78*r)]}
  const cw=11,inn=[out[0]-cw*Math.sin(78*r),out[1]+cw*Math.cos(78*r)];
  if(p==='hoodie'){
    ctx.beginPath();ctx.ellipse(...P(0,front?0:3),(hn+6)*S,(front?4:7)*S,0,0,7);
    ctx.fillStyle=shade(col,-14);ctx.strokeStyle=shade(col,-55);ctx.lineWidth=2;ctx.fill();ctx.stroke();
  }
  const neck=()=>{mv(-hn,0);ctx.quadraticCurveTo(...P(0,nd*2),...P(hn,0))};
  ctx.beginPath();neck();pt(tipX,tipY);pt(out[0],out[1]);
  if(p==='tisort'){pt(e/2,ay);pt(e/2,b);pt(-e/2,b);pt(-e/2,ay);pt(-out[0],out[1])}
  else{pt(inn[0],inn[1]);pt(e/2,ay);pt(e/2,b);pt(-e/2,b);pt(-e/2,ay);pt(-inn[0],inn[1]);pt(-out[0],out[1])}
  pt(-tipX,tipY);ctx.closePath();fillStroke(col);
  ctx.strokeStyle=shade(col,-22);ctx.lineWidth=p==='hoodie'?4:7;ctx.beginPath();neck();ctx.stroke(); // yaka bandı
  if(p!=='tisort'){ // bel ve manşet lastikleri (6 cm)
    ctx.fillStyle=shade(col,-12);ctx.strokeStyle=shade(col,-55);ctx.lineWidth=1.5;
    ctx.fillRect(X-e/2*S,t+(b-6)*S,e*S,6*S);ctx.strokeRect(X-e/2*S,t+(b-6)*S,e*S,6*S);
    const ux=Math.cos(78*r)*6,uy=Math.sin(78*r)*6;
    [-1,1].forEach(sg=>{ctx.beginPath();mv(sg*out[0],out[1]);pt(sg*inn[0],inn[1]);pt(sg*inn[0]-sg*ux,inn[1]-uy);pt(sg*out[0]-sg*ux,out[1]-uy);ctx.closePath();ctx.fill();ctx.stroke()});
  }
  if(p==='hoodie'&&front){
    ctx.strokeStyle=shade(col,-45);ctx.lineWidth=1.5;
    ctx.beginPath();mv(-.3*e,.64*b);pt(.3*e,.64*b);pt(.34*e,b-9);pt(-.34*e,b-9);ctx.closePath();ctx.stroke();
    ctx.strokeStyle=shade(col,col==='#ffffff'?-35:60);ctx.lineWidth=3;
    [-1,1].forEach(sg=>{ctx.beginPath();mv(sg*3,nd);pt(sg*3.5,nd+12);ctx.stroke()});
  }
}
function drawCap(col){
  const X=CX,Y=CY;ctx.beginPath();ctx.moveTo(X-11*S,Y+5.5*S);ctx.lineTo(X-11*S,Y-3*S);ctx.quadraticCurveTo(X-11*S,Y-7*S,X-6*S,Y-7*S);
  ctx.lineTo(X+6*S,Y-7*S);ctx.quadraticCurveTo(X+11*S,Y-7*S,X+11*S,Y-3*S);ctx.lineTo(X+11*S,Y+5.5*S);ctx.closePath();fillStroke(col);
  ctx.beginPath();ctx.arc(X,Y-7*S,.8*S,0,7);ctx.fillStyle=shade(col,-25);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(X-12*S,Y+5.5*S);ctx.quadraticCurveTo(X,Y+13*S,X+12*S,Y+5.5*S);ctx.quadraticCurveTo(X,Y+7.5*S,X-12*S,Y+5.5*S);ctx.closePath();
  ctx.fillStyle=shade(col,-25);ctx.fill();ctx.stroke();
}
function drawMug(col){
  const X=CX,Y=CY;ctx.save();ctx.beginPath();ctx.lineWidth=1.8*S;ctx.strokeStyle=shade(col,-30);ctx.arc(X+10.5*S,Y,4*S,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.roundRect(X-10.5*S,Y-5*S,21*S,10*S,.7*S);fillStroke(col);
}
function drawCanvasBoard(col,p){
  const a=getArea(p,'on'),b=PRODUCTS.kanvas.bleed*S;
  ctx.beginPath();ctx.rect(a.x,a.y,a.w,a.h);fillStroke(col);
  ctx.fillStyle='#0000000d';ctx.fillRect(a.x,a.y,a.w,b);ctx.fillRect(a.x,a.y+a.h-b,a.w,b);ctx.fillRect(a.x,a.y+b,b,a.h-2*b);ctx.fillRect(a.x+a.w-b,a.y+b,b,a.h-2*b);
  ctx.strokeStyle='#0003';ctx.lineWidth=1;ctx.strokeRect(a.x+b,a.y+b,a.w-2*b,a.h-2*b);
}
function drawProduct(p,v,col){
  const k=PRODUCTS[p].kind;
  if(k==='giyim')drawGarment(p,v,col);else if(k==='sapka')drawCap(col);else if(k==='kupa')drawMug(col);else drawCanvasBoard(col,p);
}
function drawWall(){
  const g=ctx.createRadialGradient(CX,CY,60,CX,CY,520);g.addColorStop(0,'#9a9a9a');g.addColorStop(1,'#858585');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,W);
}
function drawGuides(){
  ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#8a5cff';ctx.lineWidth=2;ctx.strokeRect(2,2,W-4,W-4);ctx.setLineDash([]);
  const depth=34;
  ctx.fillStyle='#35353f';ctx.fillRect(0,0,W,depth);ctx.fillRect(0,0,depth,W);
  ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  ctx.font='20px system-ui';ctx.textBaseline='middle';ctx.textAlign='center';
  ctx.fillText('0',depth/2,depth/2);
  drawRuler(depth,false);
  ctx.translate(0,W);
  ctx.rotate(-Math.PI/2);
  drawRuler(depth,true);
  ctx.restore();
}
function drawRuler(depth,reversed){
  const extent=W/S;
  ctx.beginPath();
  for(let cm=0;cm<=extent;cm+=5){
    const x=reversed?W-cm*S:cm*S, major=cm%10===0;
    ctx.moveTo(x,depth);
    ctx.lineTo(x,depth-(major?12:6));
    if(cm>0&&cm%20===0){
      const end=cm===extent;
      ctx.textAlign=end?(reversed?'left':'right'):'center';
      ctx.fillText(end?cm+' cm':String(cm),end?x+(reversed?4:-4):x,12);
    }
  }
  ctx.stroke();
}
function drawPrintArea({x,y,w,h},garmentColor=color,lineWidth=2.25){
  const rgb=parseInt(garmentColor.slice(1),16);
  const luma=.2126*(rgb>>16)+.7152*((rgb>>8)&255)+.0722*(rgb&255);
  ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle=luma<150?'#e7cbff':'#7142d7';ctx.lineWidth=lineWidth;
  ctx.strokeRect(x,y,w,h);ctx.restore();
}

// ---- öğeler
function itemSize(it){
  if(it.type==='text'){ctx.font=`${it.size}px ${it.font}`;const l=it.text.split('\n');return{w:Math.max(...l.map(s=>ctx.measureText(s).width)),h:l.length*it.size*1.15}}
  if(it.type==='image')return{w:it.img.width*it.s,h:it.img.height*it.s};
  return{w:it.size,h:it.size};
}
function shapePath(it,w,h){
  ctx.beginPath();const s=w/2;
  if(it.shape==='rect')ctx.rect(-w/2,-h/2,w,h);
  else if(it.shape==='circle')ctx.ellipse(0,0,w/2,h/2,0,0,7);
  else if(it.shape==='tri'){ctx.moveTo(0,-s);ctx.lineTo(s,s*.8);ctx.lineTo(-s,s*.8);ctx.closePath()}
  else if(it.shape==='star'){for(let i=0;i<10;i++){const r=i%2?w*.2:w/2,a=-Math.PI/2+i*Math.PI/5;ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath()}
  else{ctx.moveTo(0,s*.9);ctx.bezierCurveTo(-s*1.4,s*.1,-s*.7,-s,0,-s*.4);ctx.bezierCurveTo(s*.7,-s,s*1.4,s*.1,0,s*.9);ctx.closePath()}
}
function drawItem(it){

const HOFF=12;let snapV=false,snapH=false;
const uPx=()=>W/cv.getBoundingClientRect().width;
function render(c,o={}){
  const p=o.p||product,v=o.v||view,prev=ctx;ctx=c.getContext('2d');ctx.setTransform(c.width/W,0,0,c.width/W,0,0);
  drawWall();drawProduct(p,v,color);drawDesign(p,v);
  if(o.ui){
    drawGuides();
    if(showArea)drawPrintArea(getArea(p,v));
    if(sel){const {w,h}=itemSize(sel),u=uPx();ctx.save();ctx.translate(sel.x,sel.y);ctx.rotate(sel.rot*Math.PI/180);ctx.strokeStyle='#2f6fed';ctx.lineWidth=1.5*u;ctx.strokeRect(-w/2,-h/2,w,h);
      const dot=(x,y,fn)=>{ctx.save();ctx.translate(x,y);ctx.scale(u,u);ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();fn();ctx.restore()};
      dot(w/2+HOFF*u,h/2+HOFF*u,()=>{ctx.beginPath();ctx.arc(0,0,7,.6,5.4);ctx.stroke();ctx.beginPath();ctx.moveTo(4.5,-8);ctx.lineTo(9,-3);ctx.lineTo(2.5,-2.5);ctx.fillStyle='#2f6fed';ctx.fill()});
      dot(w/2+HOFF*u,-h/2-HOFF*u,()=>{ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(6,-6);ctx.moveTo(1,-6);ctx.lineTo(6,-6);ctx.lineTo(6,-1);ctx.moveTo(-1,6);ctx.lineTo(-6,6);ctx.lineTo(-6,1);ctx.stroke()});
      ctx.restore();
      if(snapV||snapH){const A=getArea(p,v);ctx.save();ctx.strokeStyle='#ff3da0';ctx.lineWidth=1.5*u;ctx.beginPath();if(snapV){ctx.moveTo(A.x+A.w/2,A.y-20);ctx.lineTo(A.x+A.w/2,A.y+A.h+20)}if(snapH){ctx.moveTo(A.x-20,A.y+A.h/2);ctx.lineTo(A.x+A.w+20,A.y+A.h/2)}ctx.stroke();ctx.restore()}
    }
  }
  ctx=prev;
}

function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}}
function hit(it,p,pad=0){
  const {w,h}=itemSize(it),a=-it.rot*Math.PI/180,dx=p.x-it.x,dy=p.y-it.y;
  const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(lx)<=w/2+pad&&Math.abs(ly)<=h/2+pad;
}
let drag=null,moved=false;
function handleHit(p){
  if(!sel)return null;const {w,h}=itemSize(sel),a=sel.rot*Math.PI/180,c=Math.cos(a),n=Math.sin(a),u=uPx(),o=HOFF*u;
  const at=(x,y)=>({x:sel.x+x*c-y*n,y:sel.y+x*n+y*c}),near=q=>Math.hypot(p.x-q.x,p.y-q.y)<=26*u;
  if(near(at(w/2+o,h/2+o)))return'rot';if(near(at(w/2+o,-h/2-o)))return'scale';return null;
}
const ptrs=new Map();let gest=null,ignore=false;
const vpEl=$('vp'),mid=()=>{const q=[...ptrs.values()];return{x:(q[0].x+q[1].x)/2,y:(q[0].y+q[1].y)/2,d:Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)||1}};
function setZoomPx(z){zoom=Math.max(50,Math.min(400,z));cv.style.width=zoom+'%';$('zoom').value=Math.min(300,zoom);$('zoomLbl').textContent=Math.round(zoom)+'%'}
cv.onpointerdown=e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size>=2){
    if(drag&&moved)commit();drag=null;snapV=snapH=false;ignore=true;
    const m=mid(),r=vpEl.getBoundingClientRect();
    gest={d0:m.d,z0:zoom,fx:(vpEl.scrollLeft+m.x-r.left)/cv.clientWidth,fy:(vpEl.scrollTop+m.y-r.top)/cv.clientHeight};return;
  }
  if(ignore)return;
  const p=pos(e);
  const hh=handleHit(p);
  if(hh){drag={[hh]:true,d0:Math.hypot(p.x-sel.x,p.y-sel.y)||1,cm0:toCm(sel)};moved=false;cv.setPointerCapture(e.pointerId);return}
  sel=(sel&&hit(sel,p,14*uPx())?sel:null)||[...cur()].reverse().find(i=>hit(i,p))||null;moved=false;
  drag=sel?{dx:p.x-sel.x,dy:p.y-sel.y}:{pan:true,x:e.clientX,y:e.clientY,sl:vpEl.scrollLeft,st:vpEl.scrollTop};syncSel();draw();
};
cv.onpointermove=e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest){if(ptrs.size<2)return;const m=mid(),r=vpEl.getBoundingClientRect();setZoomPx(gest.z0*m.d/gest.d0);
    vpEl.scrollLeft=gest.fx*cv.clientWidth-(m.x-r.left);vpEl.scrollTop=gest.fy*cv.clientHeight-(m.y-r.top);draw();return}
  if(ignore)return;
  if(drag&&drag.pan){vpEl.scrollLeft=drag.sl-(e.clientX-drag.x);vpEl.scrollTop=drag.st-(e.clientY-drag.y);return}
  if(drag&&drag.scale&&sel){const p=pos(e),k=Math.hypot(p.x-sel.x,p.y-sel.y)/drag.d0;fromCm(sel,Math.max(1,Math.min(60,drag.cm0*k)));$('pScale').value=toCm(sel);$('sizeLbl').textContent=Math.round(toCm(sel)*2)/2+' cm';moved=true;draw();return}
  if(drag&&drag.rot&&sel){const p=pos(e),{w,h}=itemSize(sel);let d=(Math.atan2(p.y-sel.y,p.x-sel.x)-Math.atan2(h,w))*180/Math.PI;d=((d+540)%360)-180;
    for(const k of [-180,-135,-90,-45,0,45,90,135,180])if(Math.abs(d-k)<4)d=k;
    sel.rot=Math.round(d);$('pRot').value=sel.rot;moved=true;draw();return}
  if(!drag||!sel)return;const p=pos(e);sel.x=p.x-drag.dx;sel.y=p.y-drag.dy;moved=true;
  const A=getArea(),t=9*uPx(),was=snapV||snapH;snapV=Math.abs(sel.x-(A.x+A.w/2))<t;snapH=Math.abs(sel.y-(A.y+A.h/2))<t;
  if(snapV)sel.x=A.x+A.w/2;if(snapH)sel.y=A.y+A.h/2;
  if((snapV||snapH)&&!was&&navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
  draw()};
cv.onpointercancel=cv.onpointerup=e=>{
  ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null;if(ptrs.size===0)ignore=false;
  if(ignore)return;
  if(drag&&moved)commit();drag=null;if(snapV||snapH){snapV=snapH=false;draw()}};

function reflow(fn,p=product){ // baskı alanı taşınırken tasarımların fiziksel boyutları korunur
  const faces=isGiyim(p)?['on','arka']:['on'];
  const previous=faces.map(v=>getArea(p,v));
  fn();
  const versions=[designs,...hist.map(s=>s.designs),...redoSt.map(s=>s.designs)];
  faces.forEach((v,index)=>{
    const next=getArea(p,v),old=previous[index];
    const dx=next.x+next.w/2-old.x-old.w/2,dy=next.y+next.h/2-old.y-old.h/2;
    if(!dx&&!dy)return;
    versions.forEach(version=>(version[key(p,v)]||[]).forEach(item=>{item.x+=dx;item.y+=dy}));
  });
}

  $('bedenBox').style.display=g?'block':'none';$('views').hidden=!g;
  [...$('printFormats').children].forEach((button,index)=>button.setAttribute('aria-pressed',String(index===sizeIdx[product])));
  const [e,b]=OLCU[isGiyim()?product:'tisort'][beden],cm=curSize(),f1=x=>(Math.round(x*10)/10).toString().replace('.',','),tee='<svg width="46" height="40" viewBox="0 0 46 40" fill="none" stroke="#333" stroke-width="2"><path d="M16 4l-11 6 4 8 5-3v21h18V15l5 3 4-8-11-6c-2 4-12 4-14 0z"/></svg>';
  let info;
  if(g)info=`${tee}<div><b>${beden} Ölçüleri (Gerçek Ölçü)</b><span>En: ${f1(e)} cm</span><span>Boy: ${f1(b)} cm</span></div>`;
  else if(P.kind==='kanvas')info=`<div><b>Kanvas Ölçüleri</b><span>Ön yüz: ${(cm.w-7.5).toString().replace('.',',')}×${(cm.h-7.5).toString().replace('.',',')} cm</span><span>Katlama payı: 3,75 cm</span></div>`;
  else info=`<div><b>${P.name} Ölçüleri</b><span>Baskı alanı: ${cm.w}×${cm.h} cm</span></div>`;
  $('info').innerHTML=info;$('info2').innerHTML=info;
  document.querySelectorAll('#views button').forEach(x=>{x.setAttribute('aria-pressed',String(x.dataset.v===view));thumb(x.firstChild,product,x.dataset.v,color,'#8d8d8d')});
  syncSel();syncHist();
}

// ---- yakınlaştırma
function setZoom(z,center){
  zoom=Math.max(50,Math.min(300,z));cv.style.width=zoom+'%';$('zoom').value=zoom;$('zoomLbl').textContent=Math.round(zoom)+'%';
  if(center||zoom>100){const vp=$('vp');vp.scrollLeft=(cv.clientWidth-vp.clientWidth)/2;vp.scrollTop=CY/W*cv.clientHeight-vp.clientHeight/2}
}
$('zoom').oninput=e=>setZoom(+e.target.value);
$('zin').onclick=()=>setZoom(zoom+25);$('zout').onclick=()=>setZoom(zoom-25);$('zfit').onclick=()=>setZoom(PRODUCTS[product].zoom,true);
$('showArea').onchange=e=>{showArea=e.target.checked;draw()};

// ---- ön izleme, indirme, sepet
function viewsWithDesign(){return(isGiyim()?['on','arka']:['on']).filter(v=>(designs[key(product,v)]||[]).length||bgs[key(product,v)])}
function download(url,name){el('a',{href:url,download:name}).click()}
function exportDesign(v){ // 300 DPI, gerçek cm boyutunda
  const a=getArea(product,v),k=300/2.54/S,c=el('canvas',{width:Math.round(a.cm.w/2.54*300),height:Math.round(a.cm.h/2.54*300)});
  const prev=ctx;ctx=c.getContext('2d');ctx.scale(k,k);ctx.translate(-a.x,-a.y);
  if(bgs[key(product,v)]){ctx.fillStyle=bgs[key(product,v)];ctx.fillRect(a.x,a.y,a.w,a.h)}
  (designs[key(product,v)]||[]).forEach(drawItem);ctx=prev;return c.toDataURL('image/png');
}
$('preview').onclick=()=>{
  sel=null;syncSel();draw();const pv=$('pv');pv.innerHTML='';$('pvBtns').innerHTML='';
  (isGiyim()?['on','arka']:['on']).forEach(v=>{
    const c=el('canvas',{width:W,height:W});render(c,{v});const f=el('figure',{},pv);
    el('img',{src:c.toDataURL('image/png')},f);el('figcaption',{textContent:v==='on'?'Ön':'Arka'},f);
    el('button',{className:'sm',textContent:`⬇ ${v==='on'?'Ön':'Arka'} ürün görseli`,onclick:()=>download(c.toDataURL('image/png'),`wolflano-${product}-${v}.png`)},$('pvBtns'));
  });
  viewsWithDesign().forEach(v=>el('button',{className:'sm',textContent:`⬇ ${v==='on'?'Ön':'Arka'} baskı dosyası (300 DPI)`,onclick:()=>download(exportDesign(v),`wolflano-${product}-${v}-baski-300dpi.png`)},$('pvBtns')));
  $('dlg').showModal();
};
$('dlgClose').onclick=()=>$('dlg').close();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
$('cart').onclick=()=>{
  const vs=viewsWithDesign();if(!vs.length){toast('Önce bir tasarım ekleyin');return}
  const detail={urun:PRODUCTS[product].name,renk:colorName,beden:isGiyim()?beden:null,baski:curSize().n,gorunumler:{}};
  vs.forEach(v=>{const c=el('canvas',{width:W,height:W});render(c,{v});detail.gorunumler[v]={onizleme:c.toDataURL('image/jpeg',.7),baski300dpi:exportDesign(v)}});
  try{const l=JSON.parse(localStorage.getItem('wolflano_sepet')||'[]');l.push(detail);localStorage.setItem('wolflano_sepet',JSON.stringify(l.slice(-3)))}catch(e){}
  window.dispatchEvent(new CustomEvent('wolflano:sepete-ekle',{detail}));
  if(window.parent!==window)window.parent.postMessage({type:'wolflano:sepete-ekle',detail},'*');
  toast('Sepete eklendi ✓');
};

buildStatic();buildProductPage();commit();syncUI();draw();setZoom(100);routeProduct();
window.addEventListener('resize',()=>{if(zoom>100)setZoom(zoom)});
</script>
